name: Deploy to Cloudflare Workers

# Publishing is manual so a source push cannot implicitly authorize production.
on:
  workflow_dispatch:
    inputs:
      approve_production:
        description: Choose YES only after reviewing the target account and release window
        required: true
        type: choice
        options: ["NO", "YES"]
        default: "NO"

# Never let two production deploys race; queue instead of cancelling so a
# merge is not left undeployed.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy production
        env:
          BLENDPROOF_PRODUCTION_APPROVED: ${{ inputs.approve_production }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$BLENDPROOF_PRODUCTION_APPROVED" != "YES" ]; then
            echo "::error::Production deployment requires the explicit YES input."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare credentials are not configured — deployment cannot proceed. Configure both production environment secrets and re-run this workflow."
            exit 1
          fi
          npm run deploy:production
