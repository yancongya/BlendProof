name: Deploy to Cloudflare Workers

# Publishing is driven from the repository: every push to main calls the same
# production script used locally. It verifies, builds, dry-runs, and deploys
# the landing page at `/`, the workspace at `/dev`, and shares at `/s/*`.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two production deploys race; queue instead of cancelling so a
# merge is not left undeployed.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify, build, and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set — skipping deploy. Add it under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 0
          fi
          npm run deploy:production
